name: Build Android APK

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
    secrets:
      LASTFM_API_KEY:
        required: false
      LASTFM_SECRET:
        required: false
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false
      DEV_KEYSTORE_BASE64:
        required: false
      DEV_KEYSTORE_PASSWORD:
        required: false
      DEV_KEY_ALIAS:
        required: false
      DEV_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Tests
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          ./gradlew :app:testDevDebugUnitTest
      - name: Configure signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
          DEV_KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
          DEV_KEY_ALIAS: ${{ secrets.DEV_KEY_ALIAS }}
          DEV_KEY_PASSWORD: ${{ secrets.DEV_KEY_PASSWORD }}
        run: python3 .github/scripts/prepare_android_signing.py
      - name: Build APK
        env:
          VARIANT: ${{ steps.signing.outputs.variant }}
          VERSION: ${{ inputs.version }}
        run: |
          args=()
          [ -z "$VERSION" ] || args+=("-Pbitchord.version=$VERSION")
          ./gradlew ":app:assemble$VARIANT" "${args[@]}"
      - name: Collect universal APK
        env:
          VARIANT: ${{ steps.signing.outputs.variant }}
        run: |
          mkdir -p dist
          case "$VARIANT" in
            ProdRelease) cp app/build/outputs/apk/prod/release/*universal*.apk dist/BitChord-android.apk ;;
            DevRelease) cp app/build/outputs/apk/dev/release/*universal*.apk dist/BitChord-android-dev.apk ;;
            *) cp app/build/outputs/apk/dev/debug/*universal*.apk dist/BitChord-android-dev.apk ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: dist/*.apk
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f bitchord-release.jks keystore.properties
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-test-reports
          path: app/build/reports/tests/
